<title>SAM.IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar escura fixa + área de trabalho clara; no celular a barra vira navegação inferior. */
:root{
  --bg:#F2F5F4;--surf:#FFFFFF;--line:#E3E8E6;--line2:#EDF1EF;
  --ink:#0F1F1E;--mut:#56676A;--acc:#0A7468;--acc2:#3FC1AE;--soft:#E3F2EF;
  --btn:#0A7468;--btntx:#FFFFFF;--dark:#0F1F1E;--darktx:#E6EFED;--darkmut:#9DB3AF;
  --side:#0F1F1E;--sidehi:#1C3331;--sidetx:#C9D6D3;
  --warnbg:#FFF4DB;--warn:#8A5A00;--bad:#A8261E;--badbg:#FCE8E6;
  --tele:#CFD9F5;--pres:#BFE5DE;--hi:#FFF1B8;--ok:#0A7468;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1413;--surf:#142220;--line:#243633;--line2:#1C2D2B;
  --ink:#E6EFED;--mut:#9DB3AF;--acc:#3FC1AE;--acc2:#3FC1AE;--soft:#17332F;
  --btn:#12907F;--btntx:#FFFFFF;--dark:#0A1110;--darktx:#E6EFED;--darkmut:#9DB3AF;
  --side:#0A1110;--sidehi:#1C3331;--sidetx:#B7C7C4;
  --warnbg:#3A2E10;--warn:#F2C86B;--bad:#F2928B;--badbg:#3A1B19;
  --tele:#2A3556;--pres:#1B4A43;--hi:#4A4210;--ok:#3FC1AE;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1413;--surf:#142220;--line:#243633;--line2:#1C2D2B;
  --ink:#E6EFED;--mut:#9DB3AF;--acc:#3FC1AE;--acc2:#3FC1AE;--soft:#17332F;
  --btn:#12907F;--btntx:#FFFFFF;--dark:#0A1110;--darktx:#E6EFED;--darkmut:#9DB3AF;
  --side:#0A1110;--sidehi:#1C3331;--sidetx:#B7C7C4;
  --warnbg:#3A2E10;--warn:#F2C86B;--bad:#F2928B;--badbg:#3A1B19;
  --tele:#2A3556;--pres:#1B4A43;--hi:#4A4210;--ok:#3FC1AE;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:16px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--side);color:var(--sidetx);padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:flex-start;height:100vh}
.side img.logo{width:150px;height:auto;display:block;margin:0 0 26px 12px}
.nv{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:500;background:none;border:0;color:inherit;text-align:left;width:100%}
.nv:hover{background:rgba(255,255,255,.05)}
.nv.on{background:var(--sidehi);color:#fff;font-weight:600}
.nv svg{flex:none}
.nv .bd{margin-left:auto;background:#3FC1AE;color:#0F1F1E;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.nv .tg{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.08em;color:#F2C86B}
.me{margin-top:auto;display:flex;gap:12px;align-items:center;padding:12px;border-top:1px solid #243C39}
.me .av{width:36px;height:36px;border-radius:50%;background:#2A4A46;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.me b{color:#fff;display:block;font-weight:600;font-size:13px}.me span{font-size:12px}
.main{flex:1;min-width:0;padding:22px 40px 64px}
.demo{font-size:12px;color:var(--mut);background:var(--warnbg);border-radius:10px;padding:8px 14px;margin-bottom:22px}
.demo b{color:var(--warn)}
.page{display:flex;flex-direction:column;gap:22px;max-width:1180px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .t{flex:1;min-width:220px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sub{color:var(--mut);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:22px 24px;min-width:0}
.card.flat{padding:0}
.card.dark{background:var(--dark);color:var(--darktx);border-color:transparent}
.card.dark .sub{color:var(--darkmut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--btn);color:var(--btntx);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.lg{height:52px;padding:0 26px;font-size:15px;border-radius:14px}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--acc)}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn[disabled]{background:var(--line);color:var(--mut);cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--line2);font-size:12px;font-weight:600;white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--soft);color:var(--acc)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.concept{display:inline-flex;font-size:10px;font-weight:800;letter-spacing:.09em;padding:3px 8px;border-radius:6px;background:var(--warnbg);color:var(--warn);vertical-align:middle}
.row{display:flex;align-items:center;gap:16px}
.row.wrap{flex-wrap:wrap}
.sp{margin-left:auto}
.lst>.it{display:flex;align-items:center;gap:18px;padding:15px 24px;border-top:1px solid var(--line2);flex-wrap:wrap}
.lst>.it:first-child{border-top:0}
.lst .tm{width:104px;font-weight:600;font-variant-numeric:tabular-nums}
.lst .nm{flex:1;min-width:160px;font-weight:600;font-size:15px}
.lst .nm small{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
.chk{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--bg);font-size:13px}
.chk i{font-style:normal;color:var(--ok);font-weight:800}
.chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.avt{width:56px;height:56px;border-radius:50%;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none}
.att{display:flex;gap:14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;text-align:left}
.att .n{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;background:var(--soft);color:var(--acc)}
.att .n.w{background:var(--warnbg);color:var(--warn)}
.att small{display:block;color:var(--mut);font-size:13px}
.vt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.card.dark .vt{border-color:#2A4A46;color:var(--darkmut)}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600}
.chip.on{background:var(--btn);color:#fff;border-color:transparent}
.card.dark .chip{background:transparent;color:var(--darktx);border-color:#35534F}
.card.dark .chip.on{background:var(--acc2);color:#0F1F1E}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.in{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surf);padding:0 14px;width:100%}
textarea.in{height:auto;padding:12px 14px;line-height:1.5;resize:vertical}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 16px;border-radius:10px;font-weight:600;color:var(--mut)}
.tab.on{background:var(--soft);color:var(--acc)}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.err{background:var(--badbg);color:var(--bad);padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600}
.okb{background:var(--soft);color:var(--acc);padding:14px 16px;border-radius:14px;font-size:14px;display:flex;gap:12px;align-items:center}
/* login */
.login{display:flex;min-height:100vh}
.login .l{flex:1;background:linear-gradient(160deg,#0F1F1E 55%,#16312E);color:#E6EFED;padding:60px max(40px,6vw);display:flex;flex-direction:column;justify-content:center;gap:22px}
.login .l img{width:250px;height:auto}
.login .l h1{color:#fff;font-size:42px;line-height:1.1;max-width:520px}
.login .l p{color:#9DB3AF;font-size:17px;max-width:470px;line-height:1.6}
.login .r{width:500px;flex:none;background:var(--surf);padding:0 64px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login .r h2{font-size:25px}
/* agenda */
.cal{display:flex;overflow-x:auto}
.cal .hrs{width:64px;flex:none}
.cal .hrs div{height:56px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.cal .col{flex:1;min-width:230px;position:relative;border-left:1px solid var(--line2);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line2) 55px,var(--line2) 56px)}
.calh{display:flex;border-bottom:1px solid var(--line);font-weight:700}
.calh div{flex:1;min-width:230px;padding:14px 18px;border-left:1px solid var(--line2)}
.calh div:first-child{width:64px;flex:none;min-width:0;border:0;padding:0}
.ev{position:absolute;left:8px;right:8px;border-radius:12px;padding:7px 12px;font-size:13px;line-height:1.35;overflow:hidden;border:2px solid transparent;text-align:left;color:var(--ink);cursor:pointer}
.ev.pres{background:var(--pres)}.ev.tele{background:var(--tele)}
.ev.sel{border-color:var(--acc)}
.ev.novo{box-shadow:0 0 0 3px var(--acc2)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
/* consulta */
.rec{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rdot{width:12px;height:12px;border-radius:50%;background:#E5483D;flex:none}
.rdot.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.wave{display:flex;gap:3px;align-items:center;height:36px;flex:1;min-width:120px}
.wave i{display:block;width:4px;border-radius:2px;background:var(--acc2);height:8px}
.wave.on i{animation:wv 0.9s infinite ease-in-out}
@keyframes wv{50%{height:30px}}
.trans{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto;padding-right:4px}
.fala{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px}
.fala.hl{background:var(--hi)}
.fala .ts{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;padding-top:2px}
.fala b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:1px}
.steps{display:flex;flex-direction:column;gap:12px}
.steps div{display:flex;gap:12px;align-items:center;color:var(--mut)}
.steps div.d{color:var(--ink)}
.steps span{width:24px;height:24px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.steps .d span{background:var(--soft);color:var(--acc)}
/* revisão */
.itc{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.itc.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--soft)}
.itc .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.itc .tx{font-size:15px;font-weight:600;line-height:1.45}
.ev-q{font-size:13px;color:var(--mut);background:var(--bg);border-radius:10px;padding:8px 12px;border:0;text-align:left;width:100%}
.ev-q b{color:var(--ink);font-weight:600}
.rej{border:1px dashed var(--bad);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.5;color:var(--ink);background:var(--badbg)}
.aval{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line2)}
.aval:first-of-type{border-top:0}
/* whatsapp */
.phone{width:100%;max-width:340px;border-radius:28px;background:#E5DDD5;padding:16px 14px;border:8px solid #0F1F1E;display:flex;flex-direction:column;gap:10px;margin-inline:auto}
.phone .h{font-size:12px;font-weight:600;text-align:center;color:#0F1F1E}
.bub{background:#fff;color:#0F1F1E;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bub.me{background:#D9FDD3;align-self:flex-end}
/* charts */
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;font-size:13px}
.bar .tr{height:12px;border-radius:6px;background:var(--line2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--acc2);border-radius:6px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi div{background:var(--bg);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:78px 14px 1fr;gap:12px;padding-bottom:16px}
.tl .dt{font-size:12px;font-weight:700;color:var(--mut);padding-top:2px}
.tl .dd{width:10px;height:10px;border-radius:50%;background:var(--acc2);margin-top:5px;position:relative}
.tl li:not(:last-child) .dd::after{content:"";position:absolute;left:4.5px;top:12px;height:calc(100% + 22px);width:1px;background:var(--line)}
.mem{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mem li{padding:10px 14px;border-radius:12px;background:var(--bg)}
.table{width:100%;border-collapse:collapse}
.table td,.table th{text-align:left;padding:12px 24px;border-top:1px solid var(--line2);font-size:14px}
.table th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-top:0}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#0F1F1E;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;gap:0;padding:6px max(4px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px));z-index:20;border-top:1px solid #243C39;align-self:auto}
  .side img.logo,.me{display:none}
  .nv{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10px;text-align:center;min-width:0;justify-content:center}
  .nv .bd{position:absolute;margin:0;transform:translate(14px,-10px);padding:1px 6px;font-size:10px}.nv .tg{display:none}
  .nv{position:relative}
  .main{padding:16px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:23px}
  .login{flex-direction:column}
  .login .l{padding:36px max(20px,env(safe-area-inset-left,0px))}
  .login .l h1{font-size:30px}
  .login .r{width:auto;padding:32px max(20px,env(safe-area-inset-left,0px))}
  .lst>.it{padding:14px 16px}
  .card{padding:18px 16px}
  .bar{grid-template-columns:100px 1fr 40px}
  .table td,.table th{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){.rdot.on,.wave.on i{animation:none}}
/*PAC-CSS*/
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.strip>div{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;min-width:0}
.strip b{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pk>div{background:var(--bg);border-radius:14px;padding:14px 16px;min-width:0}
.pk b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:2px 0}
.pk small{display:block;color:var(--mut);font-size:12px}
.card.tint{background:var(--warnbg);border-color:transparent}
.card.tint .sec{color:var(--warn)}
.gps{display:flex;flex-wrap:wrap;gap:8px}
.gp{background:var(--surf);border-radius:10px;padding:7px 12px;font-size:13px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.mini{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;width:100%;min-width:0;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mini:hover{border-color:var(--acc2)}
.mini.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--soft)}
.mini .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.mini .v small{font-size:12px;font-weight:500;color:var(--mut)}
.tl2{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.tl2 li{display:grid;grid-template-columns:70px 14px minmax(0,1fr);gap:12px;padding-bottom:14px}
.tl2 .dt{font-size:12px;font-weight:700;color:var(--mut);padding-top:10px}
.tl2 .dd{width:12px;height:12px;border-radius:50%;margin-top:11px;position:relative;background:var(--acc2)}
.tl2 li:not(:last-child) .dd::after{content:"";position:absolute;left:5px;top:14px;height:calc(100% + 30px);width:1px;background:var(--line)}
.tl2 .bx{background:var(--bg);border-radius:12px;padding:10px 14px;min-width:0}
.tl2 .t-exame .dd{background:var(--tele);box-shadow:0 0 0 1.5px var(--mut)}
.tl2 .t-med .dd{background:var(--warn)}
.tl2 .t-msg .dd{background:var(--mut)}
.tl2 .t-marco .dd{background:var(--hi);box-shadow:0 0 0 1.5px var(--warn)}
.cc{border:1px solid var(--line);border-radius:14px;background:var(--surf);overflow:hidden}
.cc.open{border-color:var(--acc2)}
.cch{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:12px 16px;text-align:left}
.cd{width:54px;flex:none;text-align:center;background:var(--soft);color:var(--acc);border-radius:12px;padding:6px 0;line-height:1.15}
.cd b{display:block;font-size:15px;font-weight:800}
.cd span{font-size:11px;font-weight:600}
.chev{margin-left:auto;font-size:20px;color:var(--mut);width:24px;text-align:center}
.ccb{display:flex;flex-direction:column;gap:14px;padding:4px 18px 18px 84px}
.bl{margin:4px 0 0;padding-left:18px}
.bl li{margin:2px 0}
@media (max-width:640px){
  .ccb{padding-left:18px}
  .tl2 li{grid-template-columns:54px 12px minmax(0,1fr);gap:8px}
  .pk b{font-size:22px}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mini .v{font-size:18px}
}
.cols.pacs{grid-template-columns:minmax(0,290px) minmax(0,1fr)}
@media (max-width:1000px){.cols.pacs{grid-template-columns:minmax(0,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bi{height:36px;padding:0 8px;font-size:14px;min-width:56px}
.tbi td:first-child{white-space:normal;min-width:96px}
.tbi td,.tbi th{font-size:13px}
.bi.miss{border-style:dashed;border-color:var(--warn);background:var(--warnbg)}
.tbi td,.tbi th{padding:8px 8px;white-space:nowrap}
.bioreview h3,.stack h3{font-size:15px;font-weight:800;margin:8px 0 0}
.bmaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bcell{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.bcell b{font-size:17px;font-variant-numeric:tabular-nums}
.bcell.tr{background:var(--soft)}
.score{text-align:right}.score b{font-size:44px;font-weight:800;color:var(--acc);letter-spacing:-.02em}.score span{color:var(--mut);font-weight:600}
.biodrop{border:2px dashed var(--line)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--acc);animation:spn 1s linear infinite;flex:none}
@keyframes spn{to{transform:rotate(360deg)}}
.t-bio .dd{background:var(--acc)}
/*PAC-END*/

  var W=120,H=34,pad=4,vs=s.pts.map(function(p){return p[1]}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);if(mn===mx){mn-=1;mx+=1}
  var X=function(m){return pad+(W-2*pad)*m/pr.hoje},Y=function(v){return H-pad-(H-2*pad)*(v-mn)/(mx-mn)};
  var l=lastPt(s);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="34" style="max-width:150px" aria-hidden="true"><polyline fill="none" stroke="var(--acc2)" stroke-width="2" stroke-linejoin="round" points="'+s.pts.map(function(p){return X(p[0])+','+Y(p[1])}).join(' ')+'"/><circle cx="'+X(l[0])+'" cy="'+Y(l[1])+'" r="3.5" fill="'+(sFlag(s,l[1])?'var(--bad)':'var(--acc2)')+'"/></svg>';
}
function bigChart(s,pr){
  var W=640,H=250,x0=54,x1=616,y0=206,y1=30;
  var vs=s.pts.map(function(p){return p[1]}),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs),sp=hi-lo;if(sp===0)sp=Math.max(1,Math.abs(hi)*.1);
  var mn=lo-sp*.35,mx=hi+sp*.35;
  var X=function(m){return x0+18+(x1-x0-18)*m/pr.hoje},Y=function(v){return y0-(y0-y1)*(v-mn)/(mx-mn)};
  var sv='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(s.n)+': '+s.pts.map(function(p){return ptTxt(s,p)+' '+s.u+' em '+pr.lab[p[0]]}).join('; ')+'" style="max-width:720px">';
  if(s.ref){var rb=Math.max(s.ref[0]==null?mn:s.ref[0],mn),rt=Math.min(s.ref[1]==null?mx:s.ref[1],mx);if(rt>rb)sv+='<rect x="'+x0+'" y="'+Y(rt)+'" width="'+(x1-x0)+'" height="'+(Y(rb)-Y(rt))+'" fill="var(--soft)"/><text x="'+(x1-6)+'" y="'+(Y(rt)+14)+'" text-anchor="end" font-size="11" font-weight="600" fill="var(--acc)">faixa de referência '+refTxt(s)+'</text>'}
  for(var i=0;i<4;i++){var v=mn+(mx-mn)*i/3;sv+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(x0-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+nf(v,s.d)+'</text>'}
  sv+='<line x1="'+X(pr.hoje)+'" x2="'+X(pr.hoje)+'" y1="'+y1+'" y2="'+y0+'" stroke="var(--mut)" stroke-dasharray="4 4"/><text x="'+X(pr.hoje)+'" y="'+(y1-10)+'" text-anchor="end" font-size="11" fill="var(--mut)">hoje</text>';
  if(s.pts.length>1)sv+='<polyline fill="none" stroke="var(--acc2)" stroke-width="2.5" stroke-linejoin="round" points="'+s.pts.map(function(p){return X(p[0])+','+Y(p[1])}).join(' ')+'"/>';
  s.pts.forEach(function(p,i){var out=sFlag(s,p[1]),last=i===s.pts.length-1;sv+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="'+(last?6:4.5)+'" fill="'+(out?'var(--bad)':'var(--acc2)')+'" stroke="var(--surf)" stroke-width="2"/><text x="'+X(p[0])+'" y="'+(Y(p[1])-13)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+(out?'var(--bad)':'var(--ink)')+'">'+esc(ptTxt(s,p))+'</text>'});
  Object.keys(pr.lab).forEach(function(m){sv+='<text x="'+X(+m)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--mut)">'+pr.lab[m]+'</text>'});
  sv+='<text x="'+X(pr.hoje)+'" y="'+(H-12)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+pr.hojeLab+'</text>';
  return sv+'</svg>';
}
function lacunas(pr){
  var g={};pr.ser.forEach(function(s){var m=lastPt(s)[0];(g[m]=g[m]||[]).push(s.n)});
  return Object.keys(g).map(function(m){return {m:+m,n:g[m]}}).filter(function(x){return pr.hoje-x.m>=6}).sort(function(a,b){return a.m-b.m}).map(function(x){
    var nm=x.n.length>3?x.n.slice(0,3).join(', ')+' e mais '+(x.n.length-3):x.n.join(', ');
    return '<span class="gp"><b>'+esc(nm)+'</b> · '+mAgo(pr,x.m)+' ('+pr.lab[x.m]+')</span>'}).join('');
}

  var ms={};pr.ser.forEach(function(s){if(s.lab)s.pts.forEach(function(p){(ms[p[0]]=ms[p[0]]||[]).push([s,p])})});
  Object.keys(ms).forEach(function(m){var l=ms[m],fora=l.filter(function(x){return sFlag(x[0],x[1][1])});
    ev.push({m:+m,o:1,t:'exame',dt:pr.lab[m],ti:'Exames colhidos ('+l.length+' parâmetros)',tx:l.slice(0,4).map(function(x){return x[0].n+' '+ptTxt(x[0],x[1])}).join(' · ')+(l.length>4?' · e mais '+(l.length-4):''),flag:fora.length?fora.length+' fora da referência: '+fora.map(function(x){return x[0].n}).join(', '):''})});
  pr.extra.forEach(function(e){ev.push({m:e.m,o:0,t:e.t,dt:pr.lab[e.m]||'',ti:e.ti,tx:e.tx})});
  (pr.bio||[]).forEach(function(r){var d=r.d,c=d.composicao,o=d.obesidade,dt=d.paciente.data;ev.push({m:r.m,o:1,t:'bio',dt:dt.slice(8,10)+'/'+dt.slice(5,7)+'/'+dt.slice(2,4),ti:'Bioimpedância importada',tx:[c.peso.kg!=null?'Peso '+nf(c.peso.kg,1)+' kg':'',o.taxa_gordura!=null?'Gordura '+nf(o.taxa_gordura,1)+'%':'',c.musculo_esqueletico.kg!=null?'Músculo esq. '+nf(c.musculo_esqueletico.kg,1)+' kg':'',d.pontuacao!=null?'Pontuação '+nf(d.pontuacao,0):''].filter(Boolean).join(' · ')})});

    case 'copymsg':if(S.signed){var tm=getMsg();var fin=function(){S.copiedMsg=true;render();setTimeout(function(){S.copiedMsg=false;render()},2000)};var fb=function(){var ta=$('#msg');if(ta){ta.focus();ta.select();try{document.execCommand('copy')}catch(x){}}fin()};try{navigator.clipboard.writeText(tm).then(fin,fb)}catch(x){fb()}}break;
    case 'agsel':S.agSel=+v;render();break;
    case 'agnew':S.formAg=true;S.agErr='';render();break;
    case 'agcancel':S.formAg=false;render();break;
    case 'agsave':agSave();break;
    case 'pac':S.pac=v;S.pacSer=null;S.pacOpen=null;S.pacFilt='all';S.bio=null;S.bioSel=null;render();break;
    case 'pser':S.pacSer=v;render();break;
    case 'pfilt':S.pacFilt=v;render();break;
    case 'pexp':S.pacOpen=(S.pacOpen===v?'':v);render();break;
    case 'biopick':if(S.bioOk){var f1=$('#biofile');if(f1)f1.click()}break;
    case 'biocam':if(S.bioOk){var f2=$('#biocamf');if(f2)f2.click()}break;
    case 'biosel':S.bioSel=+v;render();break;
    case 'biodiscard':S.bio=null;render();break;
    case 'biodel':{var pq=PR[S.pac];if(pq){bremove(pq,+v);bsave();S.bioSel=null;render();toast('Importação removida')}break}
    case 'bioconfirm':bconfirm();break;
    case 'ptab':S.pacTab=v;render();break;
    case 'vote':S.votes[k]=(S.votes[k]===v?undefined:v);if(S.votes[k]===undefined)delete S.votes[k];lsSet('samia_votes',S.votes);render();break;
    case 'cf':S.conf[v]=1;render();break;
    case 'inat':S.inat=1;render();break;
    case 'post':S.post=1;render();break;
    case 'copy':copiar();break;
  }
});
document.addEventListener('dragover',function(e){if(e.target.closest&&e.target.closest('#biodrop'))e.preventDefault()});
document.addEventListener('drop',function(e){var z=e.target.closest&&e.target.closest('#biodrop');if(!z)return;e.preventDefault();if(!S.bioOk){toast('Marque a autorização antes de enviar');return}var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)bstart(f)});
document.addEventListener('change',function(e){
  var el=e.target;if(!el.getAttribute)return;var a=el.getAttribute('data-act');
  if(a==='consent'){S.consent=el.checked;render()}
  if(a==='bioconsent'){S.bioOk=el.checked;render()}
  if(a==='bioforce'&&S.bio){S.bio.force=el.checked;render()}
  if(a==='biofile'){var fl0=el.files&&el.files[0];el.value='';if(fl0)bstart(fl0)}
  if(a==='ptog'){var pp=S.pendAI[+el.getAttribute('data-k')];if(pp)pp.on=el.checked}
});
document.addEventListener('input',function(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute('data-bind');if(!b)return;
  if(b==='busca'){S.busca=el.value;render();var n=$('#busca');n.focus();n.setSelectionRange(el.value.length,el.value.length);return}
  if(b==='zapnum'){S.zap=el.value;return}
  if(b.indexOf('bio:')===0){if(S.bio&&S.bio.d)bsetp(S.bio.d,b.slice(4),el.value);return}
  if(b==='msg'){S.msg=el.value;S.msgEdited=true;var bb=$('.phone .bub');if(bb)bb.textContent=el.value;return}
  if(b==='ed')return;
  if(b==='tx'){S.tx=el.value;var g=$('#go');if(g)g.disabled=!S.tx.trim()||gravando;return}
  if(b==='tester'){S.tester=el.value;lsSet('samia_tester',S.tester);var r=$('#rep');if(r)r.value=report();return}
  if(b==='notes'){S.notes=el.value;lsSet('samia_notes',S.notes);var r2=$('#rep');if(r2)r2.value=report();return}
  if(b.indexOf('anam.')===0){S.anam[b.slice(5)]=el.value}
});
function agSave(){
  var d=+$('#fd').value,ini=+$('#fi').value,du=+$('#fu').value,fim=ini+du,nome=$('#fp').value,tp=$('#ft').value;
  var c=S.agenda.filter(function(a){return a.doc===d&&ini<a.fim&&a.ini<fim})[0];
  if(c){S.agErr='Conflito: '+DOCS[d]+' já tem '+c.nome+' das '+fmt(c.ini)+' às '+fmt(c.fim)+'. Escolha outro horário.';render();$('#fd').value=d;$('#fi').value=ini;$('#fu').value=du;return}
  if(fim>1080){S.agErr='A consulta terminaria depois das 18:00, fora do expediente.';render();return}
  var id=Date.now();S.agenda.push({id:id,doc:d,ini:ini,fim:fim,nome:nome,tipo:tp,obs:'Nova consulta',novo:true});S.agSel=id;S.formAg=false;S.agErr='';render();toast('Consulta agendada, sem conflito');
}
function copiar(){
  var t=report();
  var fb=function(){var r=$('#rep');if(r){r.focus();r.select()}toast('Selecione e copie o texto do relatório')};
  try{navigator.clipboard.writeText(t).then(function(){toast('Relatório copiado')},fb)}catch(e){fb()}
}
window.addEventListener('DOMContentLoaded',function(){var h=(location.hash||'').slice(1);if(VIEWS[h])S.view=h;render()});
if(document.readyState!=='loading'){var h0=(location.hash||'').slice(1);if(VIEWS[h0])S.view=h0;render()}
})();
</script>
